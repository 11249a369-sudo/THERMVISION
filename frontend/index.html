<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thermal Watch — Industrial Fire Detection</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --panel: #131a24;
    --panel-2: #1a2330;
    --line: #253141;
    --text: #dbe4ef;
    --text-dim: #8a99ac;
    --ember: #ff6a3d;
    --ember-dim: #7a3624;
    --amber: #e8a13a;
    --teal: #3ac6a8;
    --danger: #ff4d4d;
    --font-ui: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #131a24, #0d1117);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 7px;
    background: radial-gradient(circle at 30% 30%, var(--ember), var(--ember-dim));
    box-shadow: 0 0 14px rgba(255,106,61,0.55);
    flex-shrink: 0;
  }
  .brand h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0.2px; }
  .brand .sub { font-size: 11.5px; color: var(--text-dim); font-family: var(--font-mono); }
  .status { display: flex; align-items: center; gap: 18px; font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }
  .status b { color: var(--text); font-weight: 500; }
  button.rerun {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 6px;
    font-family: var(--font-ui);
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  button.rerun:hover { border-color: var(--ember); }
  button.rerun:disabled { opacity: 0.5; cursor: default; }

  .layout {
    display: grid;
    grid-template-columns: 300px 1fr 360px;
    grid-template-rows: auto 1fr;
    gap: 1px;
    background: var(--line);
    height: calc(100vh - 61px);
  }
  .kpis {
    grid-column: 1 / 4;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1px;
    background: var(--line);
  }
  .kpi { background: var(--panel); padding: 14px 18px; }
  .kpi .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .kpi .value { font-family: var(--font-mono); font-size: 24px; font-weight: 600; margin-top: 4px; }
  .kpi.high .value { color: var(--danger); }
  .kpi.med .value { color: var(--amber); }
  .kpi.low .value { color: var(--teal); }

  .filters {
    background: var(--panel);
    padding: 16px;
    overflow-y: auto;
  }
  .filters h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin: 0 0 12px; font-weight: 600; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .field select, .field input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 7px 9px;
    border-radius: 5px;
    font-family: var(--font-ui);
    font-size: 13px;
  }
  .field input[type="range"] { padding: 0; }
  .range-val { font-family: var(--font-mono); font-size: 12px; color: var(--ember); float: right; }
  .legend { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
  .legend .row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-dim); }
  .legend .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  #map { width: 100%; height: 100%; background: #0d1117; }

  .side {
    background: var(--panel);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .side .chart-block { padding: 16px; border-bottom: 1px solid var(--line); }
  .side h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin: 0 0 10px; font-weight: 600; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 12px; }
  .bar-row .name { width: 108px; color: var(--text-dim); flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }
  .bar-row .count { font-family: var(--font-mono); width: 34px; text-align: right; color: var(--text); flex-shrink: 0; }

  .table-wrap { flex: 1; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th {
    position: sticky; top: 0;
    background: var(--panel-2);
    text-align: left;
    padding: 8px 10px;
    font-weight: 500;
    color: var(--text-dim);
    border-bottom: 1px solid var(--line);
    text-transform: uppercase;
    font-size: 10.5px;
    letter-spacing: 0.04em;
  }
  tbody td { padding: 7px 10px; border-bottom: 1px solid #182130; font-family: var(--font-mono); font-size: 12px; }
  tbody tr:hover { background: var(--panel-2); cursor: pointer; }
  .id-cell { color: var(--text); }
  .pill { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 10.5px; font-family: var(--font-ui); font-weight: 500; }
  .pill.High { background: rgba(255,77,77,0.15); color: var(--danger); }
  .pill.Medium { background: rgba(232,161,58,0.15); color: var(--amber); }
  .pill.Low { background: rgba(58,198,168,0.15); color: var(--teal); }

  .empty { padding: 40px 20px; text-align: center; color: var(--text-dim); font-size: 13px; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .leaflet-popup-content-wrapper { background: var(--panel-2); color: var(--text); border-radius: 6px; }
  .leaflet-popup-tip { background: var(--panel-2); }
  .popup-title { font-weight: 600; margin-bottom: 4px; font-family: var(--font-mono); }
  .popup-row { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark"></div>
    <div>
      <h1>Thermal Watch</h1>
      <div class="sub">industrial fire &amp; hotspot classification</div>
    </div>
  </div>
  <div class="status">
    <span>source <b id="data-source">—</b></span>
    <span>model accuracy <b id="acc">—</b></span>
    <span>records <b id="rec-count">—</b></span>
    <span id="trained-at">—</span>
    <select id="sample-size" style="background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:5px; padding:6px 8px; font-family:var(--font-mono); font-size:12px;">
      <option value="4000">4,000 records</option>
      <option value="8000" selected>8,000 records</option>
      <option value="20000">20,000 records</option>
      <option value="50000">50,000 records</option>
    </select>
    <button class="rerun" id="rerun-btn">Retrain on real data</button>
  </div>
</header>

<div class="layout">
  <div class="kpis">
    <div class="kpi"><div class="label">Total hotspots</div><div class="value" id="kpi-total">—</div></div>
    <div class="kpi high"><div class="label">High risk</div><div class="value" id="kpi-high">—</div></div>
    <div class="kpi med"><div class="label">Medium risk</div><div class="value" id="kpi-med">—</div></div>
    <div class="kpi low"><div class="label">Low risk</div><div class="value" id="kpi-low">—</div></div>
    <div class="kpi"><div class="label">Avg. risk score</div><div class="value" id="kpi-avg">—</div></div>
  </div>

  <div class="filters">
    <h2>Filters</h2>
    <div class="field">
      <label>Search hotspot ID</label>
      <input type="text" id="f-search" placeholder="HS_00042" />
    </div>
    <div class="field">
      <label>Risk level</label>
      <select id="f-risk">
        <option value="">All levels</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>
    </div>
    <div class="field">
      <label>Predicted class</label>
      <select id="f-class"><option value="">All classes</option></select>
    </div>
    <div class="field">
      <label>Region</label>
      <select id="f-region"><option value="">All regions</option></select>
    </div>
    <div class="field">
      <label>Min. risk score <span class="range-val" id="f-score-val">0</span></label>
      <input type="range" id="f-score" min="0" max="100" value="0" />
    </div>

    <h2 style="margin-top: 20px;">Map legend</h2>
    <div class="legend">
      <div class="row"><span class="dot" style="background:var(--danger)"></span> High risk</div>
      <div class="row"><span class="dot" style="background:var(--amber)"></span> Medium risk</div>
      <div class="row"><span class="dot" style="background:var(--teal)"></span> Low risk</div>
    </div>
  </div>

  <div id="map"></div>

  <div class="side">
    <div class="chart-block">
      <h2>Predicted class breakdown</h2>
      <div id="class-bars"></div>
    </div>
    <div class="chart-block" style="border-bottom:none; flex:1; display:flex; flex-direction:column; min-height:0;">
      <h2>Ranked hotspots (<span id="table-count">0</span>)</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Class</th><th>Region</th><th>Score</th><th>Risk</th></tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API = "/api";
let map, markersLayer;
let allData = [];
let selectedHotspot = null;

const riskColor = { High: "#ff4d4d", Medium: "#e8a13a", Low: "#3ac6a8" };

function initMap() {
  map = L.map('map', { zoomControl: true, attributionControl: false }).setView([15.5, 79.5], 5.5);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_matter_nolabels/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
  }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_matter_only_labels/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
  }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
}

function fmtTime(ts) {
  if (!ts) return "—";
  const d = new Date(ts * 1000);
  return d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

async function loadSummary() {
  const res = await fetch(`${API}/summary`);
  const s = await res.json();
  document.getElementById('data-source').textContent = s.source === 'real' ? 'VIIRS (real)' : 'Mock';
  document.getElementById('acc').textContent = s.accuracy ? (s.accuracy * 100).toFixed(1) + '%' : '—';
  document.getElementById('rec-count').textContent = s.n_records;
  document.getElementById('trained-at').textContent = 'trained ' + fmtTime(s.trained_at);
  document.getElementById('kpi-total').textContent = s.n_records;
  document.getElementById('kpi-high').textContent = s.risk_level_counts.High || 0;
  document.getElementById('kpi-med').textContent = s.risk_level_counts.Medium || 0;
  document.getElementById('kpi-low').textContent = s.risk_level_counts.Low || 0;
  document.getElementById('kpi-avg').textContent = s.avg_risk_score;

  const classSel = document.getElementById('f-class');
  classSel.innerHTML = '<option value="">All classes</option>' +
    s.predicted_classes.map(c => `<option value="${c}">${c}</option>`).join('');
  const regionSel = document.getElementById('f-region');
  regionSel.innerHTML = '<option value="">All regions</option>' +
    s.regions.map(r => `<option value="${r}">${r}</option>`).join('');

  renderClassBars(s.predicted_class_counts);
}

function renderClassBars(counts) {
  const max = Math.max(...Object.values(counts), 1);
  const palette = ["#ff6a3d", "#e8a13a", "#3ac6a8", "#7aa2e0", "#c77dff", "#f0f0f0"];
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  document.getElementById('class-bars').innerHTML = entries.map(([name, count], i) => `
    <div class="bar-row">
      <div class="name" title="${name}">${name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(count/max*100).toFixed(0)}%; background:${palette[i % palette.length]}"></div></div>
      <div class="count">${count}</div>
    </div>
  `).join('');
}

function buildQuery() {
  const params = new URLSearchParams();
  const risk = document.getElementById('f-risk').value;
  const cls = document.getElementById('f-class').value;
  const region = document.getElementById('f-region').value;
  const search = document.getElementById('f-search').value.trim();
  const minScore = document.getElementById('f-score').value;
  if (risk) params.set('risk_level', risk);
  if (cls) params.set('predicted_class', cls);
  if (region) params.set('region', region);
  if (search) params.set('search', search);
  if (minScore && minScore !== '0') params.set('min_score', minScore);
  return params.toString();
}

async function loadResults() {
  const qs = buildQuery();
  const res = await fetch(`${API}/results?${qs}`);
  allData = await res.json();
  renderMap();
  renderTable();
}

function renderMap() {
  markersLayer.clearLayers();
  allData.forEach(row => {
    const color = riskColor[row.risk_level] || "#999";
    const radius = 4 + (row.risk_score / 100) * 9;
    const marker = L.circleMarker([row.latitude, row.longitude], {
      radius,
      color,
      weight: 1,
      fillColor: color,
      fillOpacity: 0.55,
    });
    marker.bindPopup(`
      <div class="popup-title">${row.hotspot_id}</div>
      <div class="popup-row">Class: ${row.predicted_class}</div>
      <div class="popup-row">Region: ${row.region}</div>
      <div class="popup-row">Risk: ${row.risk_level} (${row.risk_score})</div>
      <div class="popup-row">FRP: ${row.frp_mw} MW · Persistence: ${row.persistence_count}</div>
    `);
    marker.addTo(markersLayer);
  });
}

function renderTable() {
  document.getElementById('table-count').textContent = allData.length;
  const rows = allData.slice(0, 300);
  document.getElementById('table-body').innerHTML = rows.length ? rows.map(row => `
    <tr onclick="focusHotspot('${row.hotspot_id}')">
      <td class="id-cell">${row.hotspot_id}</td>
      <td>${row.predicted_class}</td>
      <td>${row.region}</td>
      <td>${row.risk_score}</td>
      <td><span class="pill ${row.risk_level}">${row.risk_level}</span></td>
    </tr>
  `).join('') : `<tr><td colspan="5" class="empty">No hotspots match the current filters</td></tr>`;
}

function focusHotspot(id) {
  const row = allData.find(r => r.hotspot_id === id);
  if (!row) return;
  map.setView([row.latitude, row.longitude], 8, { animate: true });
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

const reload = debounce(loadResults, 250);

document.getElementById('f-search').addEventListener('input', reload);
document.getElementById('f-risk').addEventListener('change', reload);
document.getElementById('f-class').addEventListener('change', reload);
document.getElementById('f-region').addEventListener('change', reload);
document.getElementById('f-score').addEventListener('input', (e) => {
  document.getElementById('f-score-val').textContent = e.target.value;
  reload();
});

document.getElementById('rerun-btn').addEventListener('click', async (e) => {
  const btn = e.target;
  btn.disabled = true;
  btn.textContent = 'Retraining…';
  try {
    const seed = Math.floor(Math.random() * 100000);
    const sampleSize = document.getElementById('sample-size').value;
    await fetch(`${API}/run?seed=${seed}&sample_size=${sampleSize}`, { method: 'POST' });
    await loadSummary();
    await loadResults();
  } finally {
    btn.disabled = false;
    btn.textContent = 'Retrain on new batch';
  }
});

(async function start() {
  initMap();
  await loadSummary();
  await loadResults();
})();
</script>
</body>
</html>
